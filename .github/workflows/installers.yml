name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Installer to build
        type: choice
        default: all
        options: [all, windows, android]

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'android'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run desktop:build
      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-files | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer missing' }
          Copy-Item -LiteralPath $installer.FullName -Destination release-files/kotoba-no-shima-windows-x64-setup.exe
          Get-ChildItem release-files | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release-files/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-details
          path: |
            src-tauri/Cargo.lock
            src-tauri/target/release/kotoba-no-shima.exe
          if-no-files-found: error
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'windows'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure Android signing secrets before building a release.'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - run: npm ci
      - run: npm run android:sync
      - run: chmod +x android/gradlew
      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          mkdir -p release-files
          cp android/app/build/outputs/apk/release/app-release.apk release-files/kotoba-no-shima-android.apk
          ls -lh release-files/
      - uses: actions/upload-artifact@v4
        with:
          name: android-installer
          path: release-files/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-installer"
          path: release-files
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-files
          sha256sum *.exe *.apk > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" release-files/* --verify-tag --title "ことばの島 $GITHUB_REF_NAME" --notes-file "docs/RELEASE_$GITHUB_REF_NAME.md" --prerelease
